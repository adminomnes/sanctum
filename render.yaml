services:
  - type: web
    name: sanctum-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://sanctum-bfi.pages.dev,https://sanctum.servex.com"
